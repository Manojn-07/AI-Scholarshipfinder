<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Scholarship Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🎓 AI Scholarship Finder</h1>
    <p>Discover scholarships that match your future</p>
</header>

<div class="container">

    <h2>Student Information</h2>

    <form id="scholarshipForm">

        <label>Student Name</label>
        <input type="text" id="name" placeholder="Enter your name" required>

        <label>Education Level</label>
        <select id="education">
            <option value="PUC">PUC</option>
            <option value="UG">Undergraduate</option>
            <option value="PG">Postgraduate</option>
        </select>

        <label>Percentage / Marks</label>
        <input type="number" id="marks" min="0" max="100"
               placeholder="Enter percentage" required>

        <label>Annual Family Income (₹)</label>
        <input type="number" id="income" min="0"
               placeholder="Enter annual income" required>

        <label>Category</label>
        <select id="category">
            <option value="General">General</option>
            <option value="OBC">OBC</option>
            <option value="SC">SC</option>
            <option value="ST">ST</option>
            <option value="EWS">EWS</option>
        </select>

        <button type="submit">Find Scholarships</button>

    </form>

    <div id="results">
        <h2>Scholarship Results</h2>
        <p>Enter your details to discover matching scholarships.</p>
    </div>

</div>

<footer>
    <p>AI Scholarship Finder | Empowering Students Through Education</p>
</footer>

<script src="script.js"></script>
</body>
</html>
